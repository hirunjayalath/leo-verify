name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: true
      CERT_HMAC_SECRET: ci-hmac-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://leoverify_app:ci-app-pass@localhost:5432/postgres
      SERVICE_DATABASE_URL: postgresql://leoverify_service:ci-service-pass@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          npx prisma db execute --file supabase/auth-uid-stub.sql --config prisma7.config.ts
          npx prisma migrate deploy --config prisma7.config.ts
      - name: Set tenant role passwords
        env:
          DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          node --input-type=module -e "
          import { Client } from 'pg';
          const client = new Client({ connectionString: process.env.DIRECT_DATABASE_URL });
          await client.connect();
          await client.query(\"ALTER ROLE leoverify_app PASSWORD 'ci-app-pass'\");
          await client.query(\"ALTER ROLE leoverify_service PASSWORD 'ci-service-pass'\");
          await client.end();
          "
      - run: npm test
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate

      - name: Check Vercel Credentials
        id: check-credentials
        run: |
          if [ -n "${{ secrets.VERCEL_TOKEN }}" ] && [ -n "${{ secrets.VERCEL_PROJECT_ID }}" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Vercel credentials detected. Proceeding with deployment."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::notice title=Vercel Deployment Notice::Vercel deployment was skipped because VERCEL_TOKEN and VERCEL_PROJECT_ID are not yet set in GitHub Secrets. To enable automatic deployments, add VERCEL_TOKEN, VERCEL_PROJECT_ID, and VERCEL_ORG_ID to your repository secrets."
          fi

      - name: Pull Vercel Environment Information
        if: steps.check-credentials.outputs.has_credentials == 'true'
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        if: steps.check-credentials.outputs.has_credentials == 'true'
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        if: steps.check-credentials.outputs.has_credentials == 'true'
        id: deploy-step
        run: |
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          echo "### 🚀 Vercel Production Deployment Succeeded!" >> $GITHUB_STEP_SUMMARY
          echo "Production URL: $DEPLOYMENT_URL" >> $GITHUB_STEP_SUMMARY
