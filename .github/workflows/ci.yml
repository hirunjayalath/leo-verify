name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          CERT_HMAC_SECRET: ci-hmac-secret-at-least-32-characters-long
          NEXT_PUBLIC_APP_URL: http://localhost:3000
