<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061a35">
  <title>LeoVerify Launch Countdown</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #061a35;
      --navy-light: #0b2d59;
      --blue: #1769e0;
      --gold: #ffc43d;
      --white: #f7fbff;
      --muted: #a9bdd7;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 43%, rgba(23, 105, 224, .24), transparent 31rem),
        linear-gradient(145deg, #031226 0%, var(--navy) 58%, #08254a 100%);
      color: var(--white);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      width: min(48vw, 42rem);
      aspect-ratio: 1;
      border: 1px solid rgba(255, 196, 61, .13);
      border-radius: 50%;
      pointer-events: none;
    }

    body::before { left: -23vw; top: -38vh; }
    body::after { right: -24vw; bottom: -40vh; }

    .page {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(1.5rem, 4vw, 4rem);
      isolation: isolate;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .85rem;
      font-size: clamp(.78rem, 1.2vw, 1rem);
      font-weight: 800;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: .72rem;
      height: 2.4rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe08a, var(--gold));
      box-shadow: 0 0 30px rgba(255, 196, 61, .45);
    }

    main {
      display: grid;
      place-items: center;
      text-align: center;
    }

    .countdown {
      position: relative;
      display: grid;
      place-items: center;
      width: min(72vw, 34rem);
      aspect-ratio: 1;
    }

    .countdown::before {
      content: "";
      position: absolute;
      inset: 11%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(23, 105, 224, .17), rgba(6, 26, 53, .04) 66%, transparent 67%);
      filter: blur(2px);
    }

    .ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 16px rgba(255, 196, 61, .18));
    }

    .ring-track,
    .ring-progress {
      fill: none;
      stroke-width: 2.5;
    }

    .ring-track { stroke: rgba(255, 255, 255, .09); }

    .ring-progress {
      stroke: var(--gold);
      stroke-linecap: round;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset .7s cubic-bezier(.2, .8, .2, 1);
    }

    .number {
      position: relative;
      z-index: 1;
      min-width: 3ch;
      font-size: clamp(10rem, 31vw, 25rem);
      font-weight: 900;
      line-height: .8;
      letter-spacing: -.09em;
      color: var(--gold);
      text-shadow: 0 .08em .35em rgba(255, 196, 61, .18);
      transform-origin: center;
    }

    .number.tick { animation: tick .72s cubic-bezier(.2, .8, .2, 1); }

    @keyframes tick {
      0% { opacity: 0; transform: scale(.76); filter: blur(10px); }
      45% { opacity: 1; transform: scale(1.04); filter: blur(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    .caption {
      position: absolute;
      bottom: 7%;
      color: var(--muted);
      font-size: clamp(.72rem, 1.2vw, .92rem);
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      color: var(--muted);
      font-size: clamp(.72rem, 1.2vw, .9rem);
    }

    .launch-url { color: var(--white); font-weight: 700; }

    .skip {
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      padding: .72rem 1.15rem;
      background: rgba(255, 255, 255, .05);
      color: var(--white);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, transform .2s ease;
    }

    .skip:hover { background: rgba(255, 255, 255, .11); border-color: rgba(255, 196, 61, .55); }
    .skip:active { transform: scale(.97); }
    .skip:focus-visible { outline: 3px solid var(--gold); outline-offset: 4px; }

    .live {
      display: none;
      place-items: center;
      text-align: center;
      min-height: 100%;
      padding: 2rem;
      background: radial-gradient(circle at center, rgba(23, 105, 224, .32), transparent 34rem), var(--navy);
    }

    .live.show { display: grid; animation: reveal .55s ease both; }
    .page.hide { display: none; }

    .live h1 {
      margin: 0;
      font-size: clamp(4rem, 13vw, 10rem);
      line-height: .88;
      letter-spacing: -.07em;
    }

    .live h1 span { color: var(--gold); }

    .live p {
      margin: 1.6rem 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.5rem);
    }

    @keyframes reveal {
      from { opacity: 0; transform: scale(.96); }
      to { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 560px) {
      .page { padding: 1.25rem; }
      footer { align-items: flex-end; }
      .launch-url { display: none; }
      .countdown { width: min(94vw, 30rem); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <section class="page" id="countdownPage">
    <header class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>LeoVerify launch</span>
    </header>

    <main>
      <div class="countdown" aria-label="Launch countdown">
        <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
          <circle class="ring-track" cx="50" cy="50" r="46"></circle>
          <circle class="ring-progress" id="ring" cx="50" cy="50" r="46" pathLength="100"></circle>
        </svg>
        <div class="number tick" id="number" role="timer" aria-live="polite" aria-atomic="true">10</div>
        <div class="caption">Launching in seconds</div>
      </div>
    </main>

    <footer>
      <span class="launch-url">verify.uomleos.org</span>
      <button class="skip" id="skip" type="button">Launch now</button>
    </footer>
  </section>

  <section class="live" id="livePage" aria-live="assertive">
    <div>
      <h1>LeoVerify<br><span>is live</span></h1>
      <p>Opening the certificate verification platform…</p>
    </div>
  </section>

  <script>
    (() => {
      const destination = "https://verify.uomleos.org/";
      const number = document.getElementById("number");
      const ring = document.getElementById("ring");
      const countdownPage = document.getElementById("countdownPage");
      const livePage = document.getElementById("livePage");
      const skip = document.getElementById("skip");
      let remaining = 10;
      let finished = false;

      function launch() {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        countdownPage.classList.add("hide");
        livePage.classList.add("show");
        window.setTimeout(() => window.location.replace(destination), 900);
      }

      function tick() {
        remaining -= 1;
        if (remaining < 1) {
          launch();
          return;
        }

        number.classList.remove("tick");
        void number.offsetWidth;
        number.textContent = String(remaining);
        number.classList.add("tick");
        ring.style.strokeDashoffset = String((10 - remaining) * 10);
        document.title = `${remaining} · LeoVerify Launch`;
      }

      const timer = window.setInterval(tick, 1000);
      skip.addEventListener("click", launch);
      window.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") launch();
      });
    })();
  </script>
</body>
</html>
